[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sibutestlab8583"
version = "0.1.0"
description = "Simulador de transacciones ISO 8583 - recorrido de compra 0100/0110"
requires-python = ">=3.13"

# Versiones minimas tomadas de lo realmente resuelto en el entorno (Python 3.13.3),
# no inventadas. Ver BITACORA.md.
dependencies = [
    "pyiso8583>=4.0.1",   # codec ISO 8583; recibe la especificacion como parametro
    "aiosqlite>=0.22.1",  # adaptador de persistencia asincrono
    "fastapi>=0.141.1",   # backend web aprobado; todavia sin usar
    "uvicorn>=0.52.3",    # servidor ASGI; todavia sin usar
    "jinja2>=3.1.6",      # plantillas HTML del servidor; todavia sin usar
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[project.scripts]
sibu-init-db = "sibutestlab8583.adapters.persistence.esquema:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
